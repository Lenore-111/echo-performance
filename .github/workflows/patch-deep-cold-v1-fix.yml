name: Fix Echo deep-cold memory v1

on:
  push:
    branches:
      - feature/echo-performance-long-chat
    paths:
      - '.github/workflows/patch-deep-cold-v1-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/echo-performance-long-chat
          fetch-depth: 0

      - name: Fix deep-cold candidate loop and resume trim
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          dom = 'src/dom-compact.js'
          replace_once(dom,
          """        this.scheduleBuild(0);\n        this.scheduleCompact();\n        this.onStateChange?.();\n    }\n\n    generationStarted() {\n""",
          """        this.scheduleBuild(0);\n        this.scheduleCompact();\n        this.scheduleDeepColdTrim();\n        this.onStateChange?.();\n    }\n\n    generationStarted() {\n""")

          replace_once(dom,
          """        this.scheduleBuild(0);\n        this.scheduleCompact();\n        this.onStateChange?.();\n    }\n\n    lifecycle(type, ...args) {\n""",
          """        this.scheduleBuild(0);\n        this.scheduleCompact();\n        this.scheduleDeepColdTrim();\n        this.onStateChange?.();\n    }\n\n    lifecycle(type, ...args) {\n""")

          replace_once(dom,
          """        return detached.slice(RETAINED_DETACHED_DOM_CHUNKS).reverse();\n    }\n\n    canDeepFreezeChunk(chunk) {\n""",
          """        return detached\n            .slice(RETAINED_DETACHED_DOM_CHUNKS)\n            .reverse()\n            .filter(chunk => this.canDeepFreezeChunk(chunk));\n    }\n\n    canDeepFreezeChunk(chunk) {\n""")
          PY

      - name: Static checks
        run: npm run check

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Echo Performance CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/patch-deep-cold-v1-fix.yml
          git add src/dom-compact.js
          git diff --cached --check
          git commit -m 'fix: bound deep-cold idle retries'
          git push origin HEAD:feature/echo-performance-long-chat
