name: Apply Echo runtime sleep v1

on:
  push:
    branches:
      - feature/echo-performance-long-chat
    paths:
      - '.github/workflows/patch-runtime-sleep-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/echo-performance-long-chat
          fetch-depth: 0

      - name: Patch runtime idle paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          dom = 'src/dom-compact.js'
          replace_once(dom,
          """        this.observingMutations = false;\n        this.internalMutation = false;\n""",
          """        this.observingMutations = false;\n        this.observingResize = false;\n        this.internalMutation = false;\n""")

          replace_once(dom,
          """        this.resize.observe(root);\n\n        this.onScroll = () => this.scheduleCompact();\n""",
          """        this.onScroll = () => {\n            if (!this.enabled || this.paused || this.generating) return;\n            this.scheduleCompact();\n        };\n""")

          replace_once(dom,
          """        this.beforeInteraction = event => {\n            const shell = event.target instanceof Element ? event.target.closest('#chat > .mes') : null;\n""",
          """        this.beforeInteraction = event => {\n            if (!this.enabled || this.paused || this.generating) return;\n            const shell = event.target instanceof Element ? event.target.closest('#chat > .mes') : null;\n""")

          replace_once(dom,
          """            this.restoreAll({ clear: true, reason: 'disabled' });\n            this.disconnectMutationObserver();\n            this.cancelScheduledWork();\n""",
          """            this.restoreAll({ clear: true, reason: 'disabled' });\n            this.disconnectMutationObserver();\n            this.disconnectResizeObserver();\n            this.cancelScheduledWork();\n""")

          replace_once(dom,
          """        this.connectMutationObserver();\n        this.scheduleBuild(0);\n""",
          """        this.connectMutationObserver();\n        this.connectResizeObserver();\n        this.scheduleBuild(0);\n""")

          replace_once(dom,
          """    pause() {\n        if (!this.enabled) return;\n        this.paused = true;\n        this.restoreAll({ clear: false, reason: 'manual-pause' });\n        this.cancelScheduledWork();\n        this.onStateChange?.();\n    }\n\n    resume() {\n        if (!this.enabled) return;\n        this.paused = false;\n        this.scheduleBuild(0);\n        this.scheduleCompact();\n        this.onStateChange?.();\n    }\n\n    generationStarted() {\n        if (!this.enabled) return;\n        this.generating = true;\n        this.cancelScheduledWork();\n        const context = this.getContext();\n        if (context.chat.length) this.ensureMessageMounted(context.chat.length - 1, { reason: 'generation-start' });\n        this.onStateChange?.();\n    }\n\n    generationEnded() {\n        if (!this.enabled) return;\n        this.generating = false;\n        this.scheduleBuild(0);\n        this.scheduleCompact();\n        this.onStateChange?.();\n    }\n""",
          """    pause() {\n        if (!this.enabled) return;\n        this.paused = true;\n        this.restoreAll({ clear: false, reason: 'manual-pause' });\n        this.disconnectMutationObserver();\n        this.disconnectResizeObserver();\n        this.cancelScheduledWork();\n        this.onStateChange?.();\n    }\n\n    resume() {\n        if (!this.enabled) return;\n        this.paused = false;\n        this.connectMutationObserver();\n        this.connectResizeObserver();\n        this.scheduleBuild(0);\n        this.scheduleCompact();\n        this.onStateChange?.();\n    }\n\n    generationStarted() {\n        if (!this.enabled) return;\n        this.generating = true;\n        this.disconnectMutationObserver();\n        this.disconnectResizeObserver();\n        this.cancelScheduledWork();\n        const context = this.getContext();\n        if (context.chat.length) this.ensureMessageMounted(context.chat.length - 1, { reason: 'generation-start' });\n        this.onStateChange?.();\n    }\n\n    generationEnded() {\n        if (!this.enabled) return;\n        this.generating = false;\n        this.connectMutationObserver();\n        this.connectResizeObserver();\n        this.scheduleBuild(0);\n        this.scheduleCompact();\n        this.onStateChange?.();\n    }\n""")

          replace_once(dom,
          """    disconnectMutationObserver() {\n        this.mutations.disconnect();\n        this.observingMutations = false;\n    }\n\n    withMutationSilenced(fn) {\n""",
          """    disconnectMutationObserver() {\n        this.mutations.disconnect();\n        this.observingMutations = false;\n    }\n\n    connectResizeObserver() {\n        if (this.observingResize || !this.enabled || this.paused || this.generating) return;\n        this.resize.observe(this.root);\n        this.observingResize = true;\n    }\n\n    disconnectResizeObserver() {\n        this.resize.disconnect();\n        this.observingResize = false;\n    }\n\n    withMutationSilenced(fn) {\n""")

          replace_once(dom,
          """            if (reconnect && this.enabled) this.connectMutationObserver();\n""",
          """            if (reconnect && this.enabled && !this.paused && !this.generating) this.connectMutationObserver();\n""")

          bridge = 'src/native-bridge.js'
          replace_once(bridge,
          """    function attachCurrent() {\n        const root = viewport.root instanceof HTMLElement ? viewport.root : document.querySelector('#chat');\n""",
          """    function attachCurrent() {\n        if (!viewport.enabled || viewport.paused) return;\n        const root = viewport.root instanceof HTMLElement ? viewport.root : document.querySelector('#chat');\n""")

          replace_once(bridge,
          """            const originalCallback = command.callback;\n            command.callback = async function (args, index) {\n                const target = commandTarget(index);\n""",
          """            const originalCallback = command.callback;\n            command.callback = async function (args, index) {\n                if (!viewport.enabled || viewport.paused) {\n                    return Reflect.apply(originalCallback, this, [args, index]);\n                }\n                const target = commandTarget(index);\n""")

          replace_once(bridge,
          """    const onChatInput = event => {\n        const input = event.target;\n""",
          """    const onChatInput = event => {\n        if (!viewport.enabled || viewport.paused) return;\n        const input = event.target;\n""")

          replace_once(bridge,
          """    const onReleaseRelevantEvent = () => scheduleReleaseSweep();\n""",
          """    const onReleaseRelevantEvent = () => {\n        if (!temporaryMounts.size) return;\n        scheduleReleaseSweep();\n    };\n""")

          replace_once(bridge,
          """    const bridgedGetContext = () => {\n        bridgeStats.getContextCalls += 1;\n        bridgeStats.bridgeContextCalls += 1;\n        return bridgeContext(nativeGetContext());\n    };\n""",
          """    const bridgedGetContext = () => {\n        bridgeStats.getContextCalls += 1;\n        const context = nativeGetContext();\n        if (!viewport.enabled || viewport.paused) return context;\n        bridgeStats.bridgeContextCalls += 1;\n        return bridgeContext(context);\n    };\n""")

          index = 'index.js'
          replace_once(index,
          """        viewport.setEnabled(enabled);\n        bridge.attachCurrent();\n        checkbox.checked = viewport.enabled;\n""",
          """        viewport.setEnabled(enabled);\n        // Let the zero-delay cold-chunk build run first. Attaching bridge listeners\n        // after compaction avoids synchronously walking a 500/1000-message chat\n        // during the user's enable click.\n        if (viewport.enabled) setTimeout(() => bridge.attachCurrent(), 0);\n        checkbox.checked = viewport.enabled;\n""")
          PY

      - name: Static checks
        run: npm run check

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Echo Performance CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/patch-runtime-sleep-v1.yml
          git add index.js src/dom-compact.js src/native-bridge.js
          git diff --cached --check
          git commit -m 'perf: sleep observers and bypass idle bridge work'
          git push origin HEAD:feature/echo-performance-long-chat
